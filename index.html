<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>マンガランキング分析ツール</title>

*{box-sizing:border-box;margin:0;padding:0}
body{background:#f8f8f8;color:#1a1a1a;font-family:-apple-system,'Hiragino Sans',sans-serif;min-height:100vh}
.app{max-width:960px;margin:0 auto;padding:0 1rem 4rem}

/* ===== ヒーロー ===== */
.hero{text-align:center;padding:3rem 1rem 2rem;border-bottom:1px solid #e8e8e8;margin-bottom:2rem;background:#fff;border-radius:0 0 16px 16px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.hero h1{font-size:28px;font-weight:800;margin-bottom:8px;letter-spacing:-.5px}
.hero p{font-size:14px;color:#666;margin-bottom:1.5rem;line-height:1.7}
.hero-badges{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:1.5rem}
.svc-badge{font-size:12px;font-weight:600;padding:4px 14px;border-radius:999px}
.b-renta-h{background:#fff0e8;color:#c0550b;border:1px solid #f0c8a0}
.b-pic-h{background:#e8f0fe;color:#1a56a3;border:1px solid #b0c8f0}
.b-sey-h{background:#fff8e1;color:#8a6d00;border:1px solid #e8d888}
.b-nico-h{background:#e8f5e9;color:#2e7d32;border:1px solid #a8d8a8}
.dl-btn{display:inline-flex;align-items:center;gap:8px;padding:12px 24px;font-size:14px;font-weight:700;border-radius:10px;background:#1a1a1a;color:#fff;text-decoration:none;cursor:pointer;border:none;transition:background .15s}
.dl-btn:hover{background:#333}
.dl-btn-sub{font-size:11px;opacity:.7;font-weight:400}

/* ===== 使い方 ===== */
.how-section{background:#fff;border-radius:16px;padding:2rem;margin-bottom:2rem;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.how-section h2{font-size:18px;font-weight:800;margin-bottom:1.25rem;display:flex;align-items:center;gap:8px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.step{background:#f8f8f8;border-radius:12px;padding:16px;position:relative}
.step-num{font-size:11px;font-weight:800;color:#fff;background:#1a1a1a;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:8px}
.step h3{font-size:13px;font-weight:700;margin-bottom:4px}
.step p{font-size:12px;color:#666;line-height:1.6}
.step code{font-size:10px;background:#e8e8e8;padding:1px 5px;border-radius:4px;font-family:monospace}
